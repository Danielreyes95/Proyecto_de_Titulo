name: Node tests

on:
  push:
    branches:
      - main
      - feature/base-multiescuela-seguridad
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          find src scripts tests public/js -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: npm test
