<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Activar dirección de escuela</title>
<link rel="stylesheet" href="/assets/css/plataforma.css">
<script src="/js/activar-director.js" defer></script>
</head>
<body><main class="layout">
<header class="cabecera"><div><span class="eyebrow">GESTIÓN DE ESCUELAS</span><h1>Activación de director</h1>
<p>Vincula tu cuenta con la escuela que te invitó.</p></div></header>
<div class="panel auth-panel">
<h2 id="escuela">Comprobando invitación...</h2><p id="correo"></p>
<form id="nuevo" class="formulario" hidden>
<label>Tu nombre<input id="nombre" maxlength="120" required autocomplete="name"></label>
<label>Contraseña nueva (mínimo 12 caracteres)<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<button type="submit">Activar mi cuenta</button>
</form>
<form id="existente" class="formulario" hidden>
<p>Ya existe una cuenta con este correo. Inicia sesión para aceptar la invitación.</p>
<label>Correo<input id="email" type="email" autocomplete="username" readonly></label>
<label>Contraseña<input id="passwordExistente" type="password" autocomplete="current-password" required></label>
<button type="submit">Iniciar sesión y vincular escuela</button>
</form>
<p id="resultado" role="status" aria-live="polite"></p>
<a href="/director-acceso.html">Ir al acceso de directores</a>
</div></main></body></html>
